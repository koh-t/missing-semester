# Setup
title: 'Missing Semester'
url: https://koh-t.github.io
baseurl: /missing-semester
thumbnail: "/static/assets/thumbnails/default.png"

# Settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
permalink: /:title/
future: true
# safe: true # breaks local rendering if enabled
timezone: America/New_York

collections:
  '2019':
    output: true
  '2020':
    output: true
  '2026':
    output: true

# Excludes
exclude:
  - AGENTS.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - README.md
  - browser.sh
  - docker-compose.yml
  - vendor
